<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Makad Hopping!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sky: #87CEEB;
      --ground: #5D4037;
      --grass: #4CAF50;
      --jungle: #2E7D32;
      --banana: #FFD600;
      --accent: #FF6F00;
      --white: #FFFDE7;
      --shadow: rgba(0,0,0,0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
      user-select: none;
    }

    #game-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #title {
      font-family: 'Fredoka One', cursive;
      font-size: 2.4rem;
      color: var(--banana);
      text-shadow: 3px 3px 0 var(--accent), 0 0 30px rgba(255,214,0,0.4);
      letter-spacing: 2px;
      animation: titleBob 2s ease-in-out infinite;
    }

    @keyframes titleBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    #hud {
      display: flex;
      gap: 32px;
      align-items: center;
    }

    .hud-item {
      font-family: 'Fredoka One', cursive;
      font-size: 1.3rem;
      color: var(--white);
      background: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,214,0,0.4);
      border-radius: 12px;
      padding: 6px 18px;
      min-width: 120px;
      text-align: center;
    }

    .hud-label { font-size: 0.65rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; display: block; }

    #canvas-container {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 3px var(--banana);
    }

    canvas { display: block; }

    /* Milestone message banner */
    #milestone-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: linear-gradient(135deg, rgba(255,111,0,0.92), rgba(255,214,0,0.92));
      color: #1a1a2e;
      font-family: 'Fredoka One', cursive;
      font-size: 1.5rem;
      padding: 12px 32px;
      border-radius: 50px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 30;
      opacity: 0;
      box-shadow: 0 4px 30px rgba(255,214,0,0.5);
      transition: none;
    }
    #milestone-banner.show {
      animation: bannerPop 2.4s ease forwards;
    }
    @keyframes bannerPop {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
      15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
      25%  { transform: translate(-50%, -50%) scale(1); }
      70%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
    }

    /* Settings panel */
    #settings-btn {
      position: absolute;
      top: 10px;
      right: 14px;
      background: rgba(255,214,0,0.15);
      border: 2px solid var(--banana);
      color: var(--banana);
      border-radius: 10px;
      padding: 5px 12px;
      font-family: 'Fredoka One', cursive;
      font-size: 0.85rem;
      cursor: pointer;
      z-index: 10;
      transition: all 0.2s;
    }
    #settings-btn:hover { background: var(--banana); color: #1a1a2e; }

    #settings-panel {
      display: none;
      position: absolute;
      top: 42px;
      right: 14px;
      background: #1a1a2e;
      border: 2px solid var(--banana);
      border-radius: 14px;
      padding: 16px;
      z-index: 20;
      min-width: 260px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    #settings-panel.open { display: block; }
    #settings-panel h3 {
      font-family: 'Fredoka One', cursive;
      color: var(--banana);
      margin-bottom: 12px;
      font-size: 1rem;
    }
    .setting-row { margin-bottom: 12px; }
    .setting-row label { display: block; color: var(--white); font-size: 0.8rem; margin-bottom: 4px; opacity: 0.8; }
    .setting-row input[type=text], .setting-row input[type=url] {
      width: 100%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,214,0,0.3);
      border-radius: 8px;
      padding: 6px 10px;
      color: var(--white);
      font-size: 0.8rem;
      font-family: 'Nunito', sans-serif;
    }
    .setting-row input[type=file] { color: var(--white); font-size: 0.75rem; width: 100%; }
    .apply-btn {
      background: var(--banana);
      color: #1a1a2e;
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-family: 'Fredoka One', cursive;
      font-size: 0.85rem;
      cursor: pointer;
      width: 100%;
      margin-top: 4px;
      transition: transform 0.1s;
    }
    .apply-btn:hover { transform: scale(1.03); }

    /* Collectible legend */
    #collectible-legend {
      display: flex;
      gap: 18px;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.6);
      font-size: 0.78rem;
      font-family: 'Nunito', sans-serif;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-dot {
      width: 18px; height: 18px;
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem;
      font-family: 'Fredoka One', cursive;
      color: #1a1a2e;
      font-weight: bold;
    }

    #controls-hint {
      color: rgba(255,255,255,0.4);
      font-size: 0.75rem;
      text-align: center;
    }

    /* Win overlay */
    #win-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 50;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      border-radius: 20px;
      animation: fadeIn 0.5s ease;
    }
    #win-overlay.show { display: flex; }

    @keyframes fadeIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }

    #win-img-wrap {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid var(--banana);
      box-shadow: 0 0 40px rgba(255,214,0,0.5);
      animation: pulse 1.5s ease-in-out infinite;
    }
    #win-img-wrap img { width: 100%; height: 100%; object-fit: cover; }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 20px rgba(255,214,0,0.5); }
      50% { box-shadow: 0 0 60px rgba(255,214,0,0.9); }
    }

    #win-text {
      font-family: 'Fredoka One', cursive;
      font-size: 1.5rem;
      color: var(--white);
      text-align: center;
      max-width: 320px;
      line-height: 1.4;
      padding: 0 20px;
    }

    #win-score-display {
      font-family: 'Fredoka One', cursive;
      font-size: 2.5rem;
      color: var(--banana);
      text-shadow: 2px 2px 0 var(--accent);
    }

    #play-again-btn {
      background: var(--banana);
      color: #1a1a2e;
      border: none;
      border-radius: 14px;
      padding: 12px 36px;
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(255,214,0,0.4);
    }
    #play-again-btn:hover { transform: scale(1.05); box-shadow: 0 6px 25px rgba(255,214,0,0.6); }

    /* Win image settings */
    #win-settings {
      position: absolute;
      bottom: 10px;
      left: 14px;
      background: rgba(255,214,0,0.12);
      border: 1.5px solid rgba(255,214,0,0.35);
      color: var(--banana);
      border-radius: 9px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-family: 'Fredoka One', cursive;
      cursor: pointer;
      z-index: 10;
      transition: all 0.2s;
    }
    #win-settings:hover { background: rgba(255,214,0,0.25); }

    #win-settings-panel {
      display: none;
      position: absolute;
      bottom: 38px;
      left: 14px;
      background: #1a1a2e;
      border: 2px solid var(--banana);
      border-radius: 14px;
      padding: 14px;
      z-index: 20;
      min-width: 240px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    #win-settings-panel.open { display: block; }
    #win-settings-panel h3 { font-family: 'Fredoka One', cursive; color: var(--banana); margin-bottom: 10px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div id="game-wrapper">
    <div id="title">🐒 Makad Hopping!</div>

    <div id="hud">
      <div class="hud-item"><span class="hud-label">Score</span><span id="score-display">0</span></div>
      <div class="hud-item"><span class="hud-label">High Score</span><span id="hi-display">0</span></div>
      <div class="hud-item"><span class="hud-label">Speed</span><span id="speed-display">1.0x</span></div>
    </div>

    <div id="canvas-container">
      <canvas id="gameCanvas" width="800" height="320"></canvas>

      <!-- Milestone banner -->
      <div id="milestone-banner">🔥 Keep going!</div>

      <!-- Win screen settings -->
      <button id="win-settings">🏆 Win Screen</button>
      <div id="win-settings-panel">
        <h3>🎉 Win Screen Setup</h3>
        <div class="setting-row">
          <label>Upload win image</label>
          <input type="file" id="win-img-upload" accept="image/*" />
        </div>
        <div class="setting-row">
          <label>Or paste image URL</label>
          <input type="url" id="win-img-url" placeholder="https://..." />
        </div>
        <div class="setting-row">
          <label>Win message text</label>
          <input type="text" id="win-msg-text" placeholder="You're a legend! 🎉" value="You're a legend! 🎉" />
        </div>
        <button class="apply-btn" id="apply-win">Apply ✓</button>
      </div>

      <!-- Win overlay -->
      <div id="win-overlay">
        <div id="win-img-wrap">
          <img id="win-display-img" src="https://api.dicebear.com/7.x/fun-emoji/svg?seed=winner" alt="Winner" />
        </div>
        <div id="win-score-display">Score: 143</div>
        <div id="win-text">You're a legend! 🎉</div>
        <button id="play-again-btn">Play Again 🐒</button>
      </div>
    </div>

    <!-- Collectible legend -->
    <div id="collectible-legend">
      <div class="legend-item">
        <div class="legend-dot" style="background:#FF6F00;">1</div>
        <span>collectible-1 = 1 pt</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#7C4DFF;">2</div>
        <span>collectible-2 = 2 pts</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#00BCD4;">3</div>
        <span>collectible-3 = 3 pts</span>
      </div>
    </div>

    <div id="controls-hint">Press SPACE or ↑ to jump • Double jump allowed • Collect items to score!</div>
  </div>

  <script>
    // ============================================================
    //  ASSETS
    // ============================================================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    // Sky gradient
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.65);
    skyGrad.addColorStop(0, '#0f3443');
    skyGrad.addColorStop(1, '#2b7a8f');

    // Load images from assets folder
    function loadImg(src) {
      const img = new Image();
      img.src = src;
      return img;
    }

    const playerImg    = loadImg('assets/monkey.png');
    const collectImg1  = loadImg('assets/collectible-1.png');
    const collectImg2  = loadImg('assets/collectible-2.png');
    const collectImg3  = loadImg('assets/collectible-3.png');

    // Collectible type configs: [image, points, glowColor, label]
    const COLLECTIBLE_TYPES = [
      { img: collectImg1, pts: 1, glow: '#FF6F00', label: '1' },
      { img: collectImg2, pts: 2, glow: '#7C4DFF', label: '2' },
      { img: collectImg3, pts: 3, glow: '#00BCD4', label: '3' },
    ];

    // Milestone messages every 20 pts
    const MILESTONE_MESSAGES = [
      '🔥 Scorching hot!',
      '💨 Zoom zoom!',
      '🐒 Makad mode: ON!',
      '🍌 Banana power!',
      '⚡ Lightning fast!',
      '🌟 Star collector!',
      '🚀 To the moon!',
      '🎯 Bullseye!',
      '👑 Royalty!',
      '🦁 King of the jungle!',
    ];

    // ============================================================
    //  STATE
    // ============================================================
    let score = 0, hiScore = 0, gameRunning = false, gameOver = false;
    let speed = 4, frame = 0;
    let winText = "You're a legend! 🎉";
    let winTriggered = false;
    let lastMilestone = 0;

    // Monkey
    const monkey = {
      x: 100, y: 0, w: 56, h: 56,
      vy: 0, jumpCount: 0,
      isOnGround: true
    };
    const GROUND_Y = H - 80;
    monkey.y = GROUND_Y - monkey.h;

    let obstacles = [], collectibles = [], clouds = [], trees = [], particles = [];

    // ============================================================
    //  HELPERS
    // ============================================================
    function rand(min, max) { return Math.random() * (max - min) + min; }
    function randInt(min, max) { return Math.floor(rand(min, max + 1)); }

    // Draw player using image (fallback to drawn monkey)
    function drawMonkey(x, y, w, h, jumping) {
      ctx.save();
      if (playerImg.complete && playerImg.naturalWidth > 0) {
        // Draw shadow
        ctx.beginPath();
        ctx.ellipse(x + w / 2, GROUND_Y + 6, w * 0.4, 6, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fill();
        // Slight tilt when jumping
        if (jumping) {
          ctx.translate(x + w / 2, y + h / 2);
          ctx.rotate(-0.12);
          ctx.drawImage(playerImg, -w / 2, -h / 2, w, h);
        } else {
          ctx.drawImage(playerImg, x, y, w, h);
        }
      } else {
        // Fallback drawn monkey
        const cx = x + w / 2, cy = y + h / 2;
        ctx.beginPath();
        ctx.ellipse(cx, GROUND_Y + 6, w * 0.4, 6, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fill();
        ctx.fillStyle = '#8B4513';
        ctx.beginPath(); ctx.ellipse(cx, cy + 4, w * 0.38, h * 0.42, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#D2691E';
        ctx.beginPath(); ctx.ellipse(cx, cy + 8, w * 0.22, h * 0.28, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#8B4513';
        ctx.beginPath(); ctx.arc(cx, cy - h * 0.26, w * 0.32, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#D2691E';
        ctx.beginPath(); ctx.ellipse(cx, cy - h * 0.18, w * 0.22, h * 0.2, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(cx - 7, cy - h * 0.3, 5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + 7, cy - h * 0.3, 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#222';
        ctx.beginPath(); ctx.arc(cx - 6, cy - h * 0.3, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + 8, cy - h * 0.3, 2.5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    function drawObstacle(ob) {
      ctx.save();
      const x = ob.x, y = ob.y, w = ob.w, h = ob.h;
      const tg = ctx.createLinearGradient(x, y, x + w, y);
      tg.addColorStop(0, '#3E2723'); tg.addColorStop(1, '#5D4037');
      ctx.fillStyle = tg;
      ctx.beginPath(); ctx.roundRect(x + w * 0.2, y + h * 0.35, w * 0.6, h * 0.65, 4); ctx.fill();
      ctx.strokeStyle = '#4E342E'; ctx.lineWidth = 1.5;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.ellipse(x + w * 0.5, y + h * 0.45 + i * (h * 0.18), w * 0.25, 4, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      const colors = ['#1B5E20', '#2E7D32', '#388E3C', '#43A047'];
      const blobs = [[0.5, 0.12, 0.52],[0.25, 0.28, 0.38],[0.75, 0.28, 0.38],[0.5, 0.32, 0.42]];
      blobs.forEach(([bx, by, br], i) => {
        ctx.fillStyle = colors[i % colors.length];
        ctx.beginPath(); ctx.arc(x + w * bx, y + h * by, w * br, 0, Math.PI * 2); ctx.fill();
      });
      ctx.restore();
    }

    function drawCollectible(c) {
      ctx.save();
      const type = COLLECTIBLE_TYPES[c.type];
      const bob = Math.sin(frame * 0.08 + c.phase) * 4;
      const cx = c.x + c.w / 2, cy = c.y + c.h / 2 + bob;

      ctx.shadowColor = type.glow;
      ctx.shadowBlur = 16;

      if (type.img.complete && type.img.naturalWidth > 0) {
        ctx.drawImage(type.img, c.x, c.y + bob, c.w, c.h);
      } else {
        // Fallback colored box with point label
        ctx.fillStyle = type.glow;
        ctx.beginPath(); ctx.roundRect(c.x, c.y + bob, c.w, c.h, 8); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${c.w * 0.45}px Fredoka One`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('+' + type.pts, cx, cy);
      }

      // Floating point badge
      ctx.shadowBlur = 0;
      ctx.fillStyle = type.glow;
      ctx.beginPath();
      ctx.arc(c.x + c.w - 4, c.y + bob + 4, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = `bold 9px Fredoka One`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('+' + type.pts, c.x + c.w - 4, c.y + bob + 4);

      ctx.restore();
    }

    function drawCloud(c) {
      ctx.save();
      ctx.fillStyle = `rgba(255,255,255,${c.alpha})`;
      ctx.shadowColor = 'rgba(255,255,255,0.3)'; ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
      ctx.arc(c.x + c.r * 0.9, c.y - c.r * 0.2, c.r * 0.75, 0, Math.PI * 2);
      ctx.arc(c.x - c.r * 0.9, c.y - c.r * 0.1, c.r * 0.65, 0, Math.PI * 2);
      ctx.fill(); ctx.restore();
    }

    function drawBgTree(t) {
      ctx.save(); ctx.globalAlpha = t.alpha;
      ctx.fillStyle = '#1B5E20';
      ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(t.x - t.w * 0.5, t.y + t.h); ctx.lineTo(t.x + t.w * 0.5, t.y + t.h); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#2E7D32';
      ctx.beginPath(); ctx.moveTo(t.x, t.y - t.h * 0.3); ctx.lineTo(t.x - t.w * 0.4, t.y + t.h * 0.5); ctx.lineTo(t.x + t.w * 0.4, t.y + t.h * 0.5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#3E2723';
      ctx.fillRect(t.x - 5, t.y + t.h, 10, t.h * 0.3);
      ctx.restore();
    }

    function spawnParticles(x, y, color) {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x, y,
          vx: rand(-4, 4), vy: rand(-6, -1),
          life: 1, decay: rand(0.03, 0.07),
          r: rand(4, 10),
          color: color || `hsl(${randInt(30, 60)}, 100%, 60%)`
        });
      }
    }

    // ============================================================
    //  MILESTONE BANNER
    // ============================================================
    const milestoneBanner = document.getElementById('milestone-banner');

    function showMilestoneBanner(pts) {
      const idx = Math.floor((pts / 20) - 1) % MILESTONE_MESSAGES.length;
      milestoneBanner.textContent = MILESTONE_MESSAGES[idx];
      milestoneBanner.classList.remove('show');
      // Force reflow to restart animation
      void milestoneBanner.offsetWidth;
      milestoneBanner.classList.add('show');
      setTimeout(() => milestoneBanner.classList.remove('show'), 2500);
    }

    // ============================================================
    //  SPAWN
    // ============================================================
    let nextObstacle = 120, nextCollectible = 80;

    function spawnObstacle() {
      const h = randInt(50, 90), w = randInt(40, 60);
      obstacles.push({ x: W + 20, y: GROUND_Y - h, w, h });
      nextObstacle = randInt(Math.max(60, 140 - score * 0.4), Math.max(100, 220 - score * 0.5));
    }

    function spawnCollectible() {
      const size = 36;
      const yOptions = [GROUND_Y - size - 20, GROUND_Y - size - 80, GROUND_Y - size - 140];
      const y = yOptions[randInt(0, yOptions.length - 1)];
      // Weighted spawn: type 0 more common, type 2 rarer
      const roll = Math.random();
      const type = roll < 0.55 ? 0 : roll < 0.85 ? 1 : 2;
      collectibles.push({ x: W + 10, y, w: size, h: size, phase: rand(0, Math.PI * 2), type });
      nextCollectible = randInt(60, 140);
    }

    function initClouds() {
      for (let i = 0; i < 6; i++)
        clouds.push({ x: rand(0, W), y: rand(20, 100), r: rand(25, 50), speed: rand(0.3, 0.8), alpha: rand(0.15, 0.35) });
    }

    function initBgTrees() {
      for (let i = 0; i < 8; i++)
        trees.push({ x: rand(0, W), y: GROUND_Y - rand(60, 130), w: rand(30, 60), h: rand(60, 130), speed: rand(0.5, 1.2), alpha: rand(0.15, 0.3) });
    }

    initClouds();
    initBgTrees();

    // ============================================================
    //  INPUT
    // ============================================================
    const JUMP_FORCE = -13, MAX_JUMPS = 2;

    function jump() {
      if (!gameRunning && !gameOver) { startGame(); return; }
      if (gameOver) return;
      if (monkey.jumpCount < MAX_JUMPS) {
        monkey.vy = JUMP_FORCE;
        monkey.isOnGround = false;
        monkey.jumpCount++;
      }
    }

    document.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
    });
    canvas.addEventListener('click', () => jump());
    canvas.addEventListener('touchstart', e => { e.preventDefault(); jump(); }, { passive: false });

    // ============================================================
    //  GAME LOGIC
    // ============================================================
    function startGame() {
      score = 0; speed = 4; frame = 0;
      gameOver = false; winTriggered = false; lastMilestone = 0;
      monkey.y = GROUND_Y - monkey.h; monkey.vy = 0;
      monkey.jumpCount = 0; monkey.isOnGround = true;
      obstacles = []; collectibles = []; particles = [];
      nextObstacle = 120; nextCollectible = 80;
      gameRunning = true;
      document.getElementById('win-overlay').classList.remove('show');
      updateHUD();
    }

    function updateHUD() {
      document.getElementById('score-display').textContent = score;
      document.getElementById('hi-display').textContent = hiScore;
      document.getElementById('speed-display').textContent = speed.toFixed(1) + 'x';
    }

    function update() {
      if (!gameRunning || gameOver) return;
      frame++;

      speed = 4 + score * 0.022;
      if (speed > 14) speed = 14;

      // Monkey physics
      monkey.vy += 0.65;
      monkey.y += monkey.vy;
      if (monkey.y >= GROUND_Y - monkey.h) {
        monkey.y = GROUND_Y - monkey.h;
        monkey.vy = 0; monkey.isOnGround = true; monkey.jumpCount = 0;
      } else { monkey.isOnGround = false; }

      clouds.forEach(c => { c.x -= c.speed * 0.5; if (c.x + c.r * 2 < 0) { c.x = W + c.r; c.y = rand(20, 100); } });
      trees.forEach(t => { t.x -= t.speed; if (t.x + t.w < 0) { t.x = W + t.w; t.y = GROUND_Y - rand(60, 130); t.h = rand(60, 130); t.w = rand(30, 60); } });

      nextObstacle--; if (nextObstacle <= 0) spawnObstacle();
      nextCollectible--; if (nextCollectible <= 0) spawnCollectible();

      obstacles.forEach(ob => ob.x -= speed);
      obstacles = obstacles.filter(ob => ob.x + ob.w > -20);
      collectibles.forEach(c => c.x -= speed * 0.9);
      collectibles = collectibles.filter(c => c.x + c.w > -20);

      particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life -= p.decay; });
      particles = particles.filter(p => p.life > 0);

      // Collision — obstacles
      const mx = monkey.x + 8, my = monkey.y + 6, mw = monkey.w - 16, mh = monkey.h - 10;
      for (const ob of obstacles) {
        if (mx < ob.x + ob.w * 0.85 && mx + mw > ob.x + ob.w * 0.15 &&
            my < ob.y + ob.h && my + mh > ob.y) {
          endGame(); return;
        }
      }

      // Collision — collectibles
      for (let i = collectibles.length - 1; i >= 0; i--) {
        const c = collectibles[i];
        if (mx < c.x + c.w && mx + mw > c.x && my < c.y + c.h && my + mh > c.y) {
          const type = COLLECTIBLE_TYPES[c.type];
          spawnParticles(c.x + c.w / 2, c.y + c.h / 2, type.glow);
          collectibles.splice(i, 1);
          score += type.pts;
          if (score > hiScore) hiScore = score;
          updateHUD();

          // Milestone every 20 pts
          const milestone = Math.floor(score / 20) * 20;
          if (milestone > 0 && milestone > lastMilestone) {
            lastMilestone = milestone;
            showMilestoneBanner(milestone);
          }

          if (score >= 143 && !winTriggered) {
            winTriggered = true;
            setTimeout(showWin, 400);
          }
        }
      }
    }

    function endGame() { gameOver = true; gameRunning = false; }

    function showWin() {
      gameRunning = false;
      document.getElementById('win-score-display').textContent = 'Score: ' + score;
      document.getElementById('win-text').textContent = winText;
      document.getElementById('win-overlay').classList.add('show');
    }

    // ============================================================
    //  RENDER
    // ============================================================
    function render() {
      ctx.clearRect(0, 0, W, H);

      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      for (let i = 0; i < 30; i++) {
        const sx = ((i * 137 + frame * 0.02) % W);
        const sy = (i * 73) % (H * 0.55);
        const sr = 0.5 + (i % 3) * 0.5;
        ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
      }

      clouds.forEach(drawCloud);
      trees.sort((a, b) => a.alpha - b.alpha).forEach(drawBgTree);

      const gg = ctx.createLinearGradient(0, GROUND_Y, 0, H);
      gg.addColorStop(0, '#4CAF50'); gg.addColorStop(0.12, '#388E3C');
      gg.addColorStop(0.2, '#5D4037'); gg.addColorStop(1, '#3E2723');
      ctx.fillStyle = gg; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

      ctx.strokeStyle = '#81C784'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(W, GROUND_Y); ctx.stroke();

      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      for (let i = 0; i < 50; i++) {
        const gx = ((i * 31 + frame * speed * 0.8) % W);
        ctx.beginPath(); ctx.arc(gx, GROUND_Y + 4 + (i % 5) * 3, 1.5, 0, Math.PI * 2); ctx.fill();
      }

      obstacles.forEach(drawObstacle);
      collectibles.forEach(drawCollectible);
      drawMonkey(monkey.x, monkey.y, monkey.w, monkey.h, !monkey.isOnGround);

      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      });

      // Start / Game Over screen
      if (!gameRunning && !winTriggered) {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, 0, W, H);
        ctx.font = "bold 52px 'Fredoka One', cursive";
        ctx.textAlign = 'center';

        if (gameOver) {
          ctx.fillStyle = '#FF5252'; ctx.shadowColor = '#FF5252'; ctx.shadowBlur = 20;
          ctx.fillText('Game Over!', W / 2, H / 2 - 40);
          ctx.shadowBlur = 0;
          ctx.font = "28px 'Fredoka One', cursive"; ctx.fillStyle = '#FFD600';
          ctx.fillText(`Score: ${score}`, W / 2, H / 2 + 10);
          ctx.font = "22px 'Nunito', sans-serif"; ctx.fillStyle = 'rgba(255,255,255,0.7)';
          ctx.fillText('Tap / Space to try again 🐒', W / 2, H / 2 + 50);
        } else {
          ctx.fillStyle = '#FFD600'; ctx.shadowColor = '#FFD600'; ctx.shadowBlur = 20;
          ctx.fillText('Makad Hopping!', W / 2, H / 2 - 30);
          ctx.shadowBlur = 0;
          ctx.font = "22px 'Nunito', sans-serif"; ctx.fillStyle = 'rgba(255,255,255,0.8)';
          ctx.fillText('Tap or press Space to start 🚀', W / 2, H / 2 + 20);
          ctx.font = "16px 'Nunito', sans-serif"; ctx.fillStyle = 'rgba(255,255,255,0.5)';
          ctx.fillText('Reach score 143 to unlock a special surprise!', W / 2, H / 2 + 52);
        }
      }
    }

    function loop() { update(); render(); requestAnimationFrame(loop); }
    loop();

    // ============================================================
    //  UI CONTROLS
    // ============================================================
    const winSettingsBtn = document.getElementById('win-settings');
    const winSettingsPanel = document.getElementById('win-settings-panel');
    winSettingsBtn.addEventListener('click', e => { e.stopPropagation(); winSettingsPanel.classList.toggle('open'); });
    document.addEventListener('click', () => { winSettingsPanel.classList.remove('open'); });
    winSettingsPanel.addEventListener('click', e => e.stopPropagation());

    document.getElementById('apply-win').addEventListener('click', () => {
      const url = document.getElementById('win-img-url').value.trim();
      const file = document.getElementById('win-img-upload').files[0];
      const msg = document.getElementById('win-msg-text').value.trim();

      if (msg) { winText = msg; document.getElementById('win-text').textContent = msg; }

      const applyWinImg = (src) => {
        document.getElementById('win-display-img').src = src;
        const img = new Image(); img.crossOrigin = 'anonymous'; img.src = src;
      };

      if (file && !url) {
        const reader = new FileReader();
        reader.onload = e => applyWinImg(e.target.result);
        reader.readAsDataURL(file);
      } else if (url) { applyWinImg(url); }

      winSettingsPanel.classList.remove('open');
    });

    document.getElementById('play-again-btn').addEventListener('click', () => startGame());
  </script>
</body>
</html>

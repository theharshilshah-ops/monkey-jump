<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>❤️ 10 Months With You</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: linear-gradient(to bottom, #111827, #1f2937);
      font-family: 'Fredoka', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
    }

    #gameWrapper {
      position: relative;
      width: 900px;
      max-width: 95vw;
    }

    #title {
      text-align: center;
      font-size: 2.5rem;
      margin-bottom: 10px;
      color: #ff7eb3;
    }

    #hud {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 10px;
    }

    .hudBox {
      background: rgba(255,255,255,0.08);
      padding: 10px 18px;
      border-radius: 14px;
      backdrop-filter: blur(10px);
    }

    canvas {
      width: 100%;
      border-radius: 24px;
      border: 3px solid rgba(255,255,255,0.15);
      background: linear-gradient(to bottom, #0f172a, #1e293b);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    #introScreen,
    #endScreen {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      border-radius: 24px;
      text-align: center;
      padding: 30px;
    }

    #endScreen {
      display: none;
    }

    .mainTitle {
      font-size: 3rem;
      color: #ff7eb3;
      margin-bottom: 20px;
    }

    .subText {
      font-size: 1.2rem;
      max-width: 500px;
      opacity: 0.85;
      line-height: 1.6;
    }

    .btn {
      margin-top: 30px;
      padding: 14px 30px;
      border: none;
      border-radius: 50px;
      background: #ff7eb3;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
      font-family: inherit;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    #milestone {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.12);
      padding: 12px 24px;
      border-radius: 50px;
      backdrop-filter: blur(10px);
      opacity: 0;
      transition: 0.4s;
      z-index: 20;
      font-size: 1rem;
      color: #ffd6e7;
    }

    #milestone.show {
      opacity: 1;
      top: 40px;
    }

    #endImage {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
      border: 4px solid #ff7eb3;
      box-shadow: 0 0 40px rgba(255,126,179,0.5);
    }

    @media(max-width:768px){
      .mainTitle{
        font-size:2rem;
      }

      .subText{
        font-size:1rem;
      }
    }
  </style>
</head>
<body>

<div id="gameWrapper">

  <h1 id="title">❤️ 10 Months With You</h1>

  <div id="hud">
    <div class="hudBox">Score: <span id="score">0</span></div>
    <div class="hudBox">Target: 143 ❤️</div>
  </div>

  <div id="milestone"></div>

  <canvas id="gameCanvas" width="900" height="400"></canvas>

  <div id="introScreen">
    <div class="mainTitle">❤️ 10 Months With You</div>

    <div class="subText">
      143 reasons to love you.<br>
      And still counting forever ✨
    </div>

    <button class="btn" id="startBtn">
      Start Our Journey ❤️
    </button>
  </div>

  <div id="endScreen">
    <img src="./assets/exit-image.jpg" id="endImage">

    <div class="mainTitle">143 ❤️</div>

    <div class="subText">
      10 months down,<br>
      forever to go ❤️<br><br>

      Happy Anniversary Love ✨
    </div>

    <button class="btn" onclick="location.reload()">
      Play Again ❤️
    </button>
  </div>

</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

const monkeyImg = new Image();
monkeyImg.src = "./assets/monkey.png";

const collectibles = [];

const collectibleImages = [];

for(let i=1;i<=3;i++){
  const img = new Image();
  img.src = `./assets/collectible-${i}.png`;
  collectibleImages.push(img);
}

const player = {
  x:100,
  y:280,
  w:70,
  h:70,
  vy:0,
  gravity:0.7,
  jump:-14,
  grounded:true
};

let gameStarted = false;
let gameEnded = false;
let score = 0;
let speed = 5;

const obstacles = [];

const milestoneMessages = {
  10:"✨ Every moment with you feels special",
  35:"💖 You're my favorite notification",
  60:"🌸 Life feels softer with you",
  90:"☁️ You're my peace",
  120:"❤️ Still choosing you every day"
};

function showMilestone(text){
  const el = document.getElementById("milestone");

  el.innerText = text;
  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },2000);
}

function spawnObstacle(){
  obstacles.push({
    x:W,
    y:300,
    w:40,
    h:60
  });
}

function spawnCollectible(){
  collectibles.push({
    x:W,
    y:Math.random()*180+80,
    w:40,
    h:40,
    img:collectibleImages[Math.floor(Math.random()*3)]
  });
}

document.getElementById("startBtn").onclick = ()=>{
  document.getElementById("introScreen").style.display = "none";
  gameStarted = true;
};

document.addEventListener("keydown",(e)=>{
  if(e.code==="Space" && player.grounded){
    player.vy = player.jump;
    player.grounded = false;
  }
});

canvas.addEventListener("click",()=>{
  if(player.grounded){
    player.vy = player.jump;
    player.grounded = false;
  }
});

function update(){

  if(!gameStarted || gameEnded) return;

  player.vy += player.gravity;
  player.y += player.vy;

  if(player.y >= 280){
    player.y = 280;
    player.vy = 0;
    player.grounded = true;
  }

  if(Math.random()<0.02){
    spawnObstacle();
  }

  if(Math.random()<0.03){
    spawnCollectible();
  }

  obstacles.forEach((ob,i)=>{
    ob.x -= speed;

    if(
      player.x < ob.x + ob.w &&
      player.x + player.w > ob.x &&
      player.y < ob.y + ob.h &&
      player.y + player.h > ob.y
    ){
      gameEnded = true;
      location.reload();
    }
  });

  collectibles.forEach((c,i)=>{
    c.x -= speed;

    if(
      player.x < c.x + c.w &&
      player.x + player.w > c.x &&
      player.y < c.y + c.h &&
      player.y + player.h > c.y
    ){
      collectibles.splice(i,1);

      score++;

      document.getElementById("score").innerText = score;

      if(milestoneMessages[score]){
        showMilestone(milestoneMessages[score]);
      }

      if(score >= 143){
        gameEnded = true;
        document.getElementById("endScreen").style.display = "flex";
      }
    }
  });
}

function drawBackground(){

  ctx.fillStyle = "#1e293b";
  ctx.fillRect(0,0,W,H);

  for(let i=0;i<50;i++){
    ctx.fillStyle = "rgba(255,255,255,0.08)";
    ctx.beginPath();
    ctx.arc(
      (i*70 + performance.now()*0.01)%W,
      (i*40)%H,
      2,
      0,
      Math.PI*2
    );
    ctx.fill();
  }

  ctx.fillStyle = "#243447";
  ctx.fillRect(0,350,W,50);
}

function render(){

  drawBackground();

  ctx.drawImage(
    monkeyImg,
    player.x,
    player.y,
    player.w,
    player.h
  );

  ctx.fillStyle = "#8B4513";

  obstacles.forEach(ob=>{
    ctx.fillRect(ob.x,ob.y,ob.w,ob.h);
  });

  collectibles.forEach(c=>{
    ctx.drawImage(c.img,c.x,c.y,c.w,c.h);
  });
}

function loop(){
  update();
  render();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
